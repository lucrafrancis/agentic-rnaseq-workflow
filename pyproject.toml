[project]
name = "agentic-rnaseq-workflow"
version = "0.1.0"
description = "An agentic LLM workflow that builds sample sheets and submits nf-core/rnaseq runs."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents", "core"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
